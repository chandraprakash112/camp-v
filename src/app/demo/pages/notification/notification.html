<div class="row">
    <div class="col-sm-12">
        <app-card cardTitle="Notification">
            <div class="card shadow-sm border-0 m-3 bg-light"
                *ngFor="let list of notificationList; let i = index; trackBy: trackByIndex">
                <div class="card-body d-flex justify-content-between align-items-start gap-3">
                    <div class="d-flex align-items-center gap-3 flex-grow-1">
                        <div class="flex-shrink-0">
                            <i class="bi bi-bell"></i>
                        </div>

                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start">
                                <h6 class="card-title mb-1 fw-semibold text-dark p-0">{{ list?.title }}</h6>
                                <small class="text-muted time">{{ list?.created_at | timeOrDate }}</small>
                            </div>
                            <p class="card-text text-muted mb-0">{{ list?.msg }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </app-card>
            
        <div class="text-center my-3"
            *ngIf="notificationList?.length !== 0 && notificationList?.length < totalElements">
            <button type="button" [disabled]="loadMore" class="btn btn-outline-primary px-4 py-2 rounded-pill shadow-sm"
                (click)="updatePagination({ currentPage: filters.pageNo + 1 })">
                <i class="bi bi-chevron-down me-1"></i> View More Notifications
            </button>
        </div>
    </div>
</div>
