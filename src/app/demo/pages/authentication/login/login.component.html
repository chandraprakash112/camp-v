<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <a href="#" class="d-flex justify-content-center">
            <img src="assets/logo1.png" alt="logo" />
          </a>
          <div class="row">
            <div class="d-flex justify-content-center">
              <div class="auth-header">
                <h2 class="text-secondary mt-5"><b>Hi, Welcome Back</b></h2>
                <p class="fs-4 mt-2">Enter your credentials to continue</p>
              </div>
            </div>
          </div>
          <!-- <div class="d-grid">
            <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
              <img src="assets/images/authentication/google-icon.svg" alt="google" />
              Sign In With Google
            </button>
          </div>
          <div class="saprator mt-3">
            <span>or</span>
          </div> -->
          <form class="" novalidate [formGroup]="signInForm" (ngSubmit)="onLogin()">

          <!-- <h5 class="my-4 d-flex justify-content-center">Sign in with Email address</h5> -->
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput" formControlName="email" />
            <label for="floatingInput">Email address / Username</label>
          </div>
          <div class="invalid-feedback">Please enter your Email.</div>
          <div class="form-floating mb-3">
            <input [type]="this.isPasswordVisible ? 'text': 'password'" class="form-control" id="password" formControlName="password" placeholder="Enter Password" />
            <label for="password">Password</label>
          </div>
          <!-- <div class="col-12">
                    <label for="yourPassword" class="form-label">Password</label>
                    <div class="input-group has-validation">
                      <input [type]="this.isPasswordVisible ? 'text': 'password'" name="password" class="form-control"
                        id="yourPassword" appValidateForm [isSubmitted]="isSubmitted" id="yourPassword" required
                        formControlName="password" placeholder="Enter Password">
                      <span class="input-group-text" id="inputGroupPrepend"
                        [ngClass]="this.isPasswordVisible ? 'bi-eye': 'bi-eye-slash'" (click)="togglePasswordIcon()"><i
                          #passwordIcon class="bi"></i></span>
                      <div class="invalid-feedback">Please enter your password!</div>
                    </div>
                  </div> -->
          <div class="d-flex mt-1 justify-content-between">
            <div class="form-check">
              <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked="" />
              <label class="form-check-label text-muted" for="customCheckc1">Remember me</label>
            </div>
            <h5 class="text-secondary">
              <a href="javascript:">Forgot Password?</a>
            </h5>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-secondary">Sign In</button>
          </div>
          <hr />
          <h5 class="d-flex justify-content-center">
            <a [routerLink]="['/register']">Don't have an account?</a>
          </h5>
        </form>
        </div>
      </div>
    </div>
  </div>
</div>
