<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center py-2 px-4">
    @if (!customHeader) {
    <h5>{{ cardTitle }}</h5>
    }
    @if (modalId) {
    <button type="button" class="btn btn-primary py-1 px-3" data-bs-toggle="modal" [attr.data-bs-target]="'#' + modalId"
      #addModal id="addModal" (click)="callbackFun?.emit()">
      <i class="bi bi-plus-circle fs-5 me-1"></i> Add
    </button>
    }
  </div>
  <div class="card-block">
    <ng-content></ng-content>
  </div>
</div>
